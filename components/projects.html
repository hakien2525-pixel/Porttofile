<div class="projects-window" id="projects-window" style="display: none;">
    <div class="projects-header" id="projects-header">
        <div class="projects-header-left">
            <div class="window-btn close-mac" id="close-projects-mac"></div>
            <div class="window-btn minimize"></div>
            <div class="window-btn maximize"></div>
        </div>
        <div class="projects-title">Showcase</div>
        <div class="projects-header-right">
            <div class="header-close-icon" id="close-projects">✕</div>
        </div>
    </div>
    
    <div class="projects-body">
        <div class="projects-hero">
            <h1 class="hero-title" contenteditable="true" data-prj-edit="hero-title">Crafting Digital Experiences</h1>
            <p class="hero-subtitle" contenteditable="true" data-prj-edit="hero-sub">A curated collection of my best work, side projects, and recognitions.</p>
        </div>

        <div class="projects-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="uiux">UI/UX Design</button>
            <button class="filter-btn" data-filter="dev">Development</button>
            <button class="filter-btn" data-filter="awards">Awards</button>
        </div>

        <div class="projects-grid" id="projects-grid">
            <!-- Projects injected via JS -->
        </div>
    </div>
</div>
